name: Build export binary (linux x86_64)

# Builds the public workspace (no sentrux-pro) and uploads the `sentrux`
# binary — which now includes `sentrux export --json` — as an artifact.

on:
  workflow_dispatch:
  push:
    branches: [feat/json-export]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: System deps (egui / wgpu)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libvulkan-dev

      - name: Build
        run: cargo build --release --bin sentrux

      - name: Smoke-check the new subcommand exists
        run: ./target/release/sentrux export --help || true

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: sentrux-linux-x86_64
          path: target/release/sentrux
          if-no-files-found: error
